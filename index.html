<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NexaSilicon English Study</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EnglishCoach">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #0f172a;
      z-index: 10;
    }
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      z-index: 50;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Floating Install Pill for Android Chrome (shown when not in standalone mode) */
    #installBar {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.15);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      align-items: center;
      gap: 10px;
      animation: floatIn 0.5s ease-out;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size: 16px; font-weight: 800; color: #f8fafc; letter-spacing: -0.3px;">NexaSilicon English Study</div>
    <div style="font-size: 13px; color: #94a3b8; margin-top: 6px;">AI Companion 로딩 중...</div>
  </div>

  <!-- Real Fullscreen GAS Web App (Direct Full-Bleed Embedding) -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyYGKuvLPeQIhS0Zax55ULiC_L2owXYXIKNI0fYU0CVrUu8QHWdFquWJkIf51k7t-4ciw/exec"
    allow="camera; microphone; geolocation; clipboard-write; autoplay; fullscreen"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
    onload="hideLoading(); syncIframeMetrics();"
    scrolling="yes"
  ></iframe>

  <!-- 1-Click Install Button (Visible in browser mode only) -->
  <div id="installBar" onclick="triggerInstall()">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
    </svg>
    <span>스마트폰 앱으로 설치하기</span>
  </div>

  <script>
    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
    }

    // Dynamic Safe-Area Measuring Probe with iPhone 16 Pro Rounded-Edge & Home Bar Clearance
    function getSafeInsetBottom() {
      const probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;bottom:0;left:0;right:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none;';
      document.body.appendChild(probe);
      const computed = window.getComputedStyle(probe).paddingBottom;
      document.body.removeChild(probe);
      const pxVal = parseInt(computed, 10);
      // iPhone 16 Pro has a 55pt corner radius. A standard 34px inset leaves text too close to the curved corners.
      // 40px ensures the tab labels are lifted into the flat screen area (52pt clearance from physical bottom).
      const safeBottom = (!isNaN(pxVal) && pxVal >= 40) ? pxVal : 40;
      return safeBottom + 'px';
    }

    // Measure physical full screen height on mobile devices
    function getDeviceFullHeight() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);

      if (!isMobile) {
        return window.innerHeight || document.documentElement.clientHeight || 0;
      }

      if (isStandalone) {
        const isLandscape = Math.abs(window.orientation || 0) === 90 || window.innerWidth > window.innerHeight;
        const sH = window.screen ? window.screen.height : 0;
        const sW = window.screen ? window.screen.width : 0;
        const physicalHeight = isLandscape ? Math.min(sH, sW) : Math.max(sH, sW);
        return Math.max(physicalHeight, window.innerHeight || 0);
      } else {
        return window.innerHeight || document.documentElement.clientHeight || 0;
      }
    }

    // Full-Bleed Viewport & Iframe Synchronization
    function syncIframeMetrics() {
      const frame = document.getElementById('appFrame');
      if (!frame) return;

      const targetHeight = getDeviceFullHeight();
      if (targetHeight > 0) {
        frame.style.height = targetHeight + 'px';
      }
      frame.style.width = '100vw';

      // Send host safe-area-inset-bottom (with corner-radius buffer) to child iframe with staggered sync
      const sendSafeArea = () => {
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({
              type: 'PWA_SAFE_AREA',
              bottom: getSafeInsetBottom()
            }, '*');
          }
        } catch (e) {}
      };

      sendSafeArea();
      setTimeout(sendSafeArea, 400);
      setTimeout(sendSafeArea, 1200);
    }

    window.addEventListener('resize', syncIframeMetrics);
    window.addEventListener('orientationchange', () => setTimeout(syncIframeMetrics, 200));
    window.addEventListener('pageshow', syncIframeMetrics);
    window.addEventListener('load', syncIframeMetrics);
    document.addEventListener('DOMContentLoaded', syncIframeMetrics);
    syncIframeMetrics();

    // PWA Service Worker Registration & Real-time Update Check
    if ('serviceWorker' in navigator) {
      // Auto-reload when a new service worker takes control (instant update)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('PWA ServiceWorker registered:', reg.scope);
            reg.update(); // Trigger proactive update check
          })
          .catch(err => console.error('PWA ServiceWorker registration failed:', err));
      });
    }

    // Floating 1-Click Install Button Handler
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        const bar = document.getElementById('installBar');
        if (bar) bar.style.display = 'flex';
      }
    });

    window.addEventListener('appinstalled', () => {
      const bar = document.getElementById('installBar');
      if (bar) bar.style.display = 'none';
      deferredPrompt = null;
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            const bar = document.getElementById('installBar');
            if (bar) bar.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }
  </script>
</body>
</html>
