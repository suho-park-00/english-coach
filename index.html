<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NexaSilicon English Study</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EnglishCoach">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    #appFrameContainer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 10;
      background-color: #0f172a;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #0f172a;
    }
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      z-index: 5;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Floating Install Pill for Android Chrome (shown when not in standalone mode) */
    #installBar {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.15);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      align-items: center;
      gap: 10px;
      animation: floatIn 0.5s ease-out;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size: 16px; font-weight: 800; color: #f8fafc; letter-spacing: -0.3px;">NexaSilicon English Study</div>
    <div style="font-size: 13px; color: #94a3b8; margin-top: 6px;">AI Companion 로딩 중...</div>
  </div>

  <!-- Real Fullscreen GAS Web App with all microphone / camera permissions -->
  <div id="appFrameContainer">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyYGKuvLPeQIhS0Zax55ULiC_L2owXYXIKNI0fYU0CVrUu8QHWdFquWJkIf51k7t-4ciw/exec"
      allow="camera; microphone; geolocation; clipboard-write; autoplay; fullscreen"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
      onload="hideLoading()"
      scrolling="yes"
    ></iframe>
  </div>

  <!-- 1-Click Install Button (Visible in browser mode only) -->
  <div id="installBar" onclick="triggerInstall()">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
    </svg>
    <span>스마트폰 앱으로 설치하기</span>
  </div>

  <script>
    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch(err => console.error('PWA ServiceWorker registration failed:', err));
      });
    }

    // Floating 1-Click Install Button Handler
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent automatic mini-infobar on mobile
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        const bar = document.getElementById('installBar');
        if (bar) bar.style.display = 'flex';
      }
    });

    window.addEventListener('appinstalled', () => {
      const bar = document.getElementById('installBar');
      if (bar) bar.style.display = 'none';
      deferredPrompt = null;
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            const bar = document.getElementById('installBar');
            if (bar) bar.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }
  </script>
</body>
</html>
